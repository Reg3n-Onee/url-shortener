server {
    listen 80;

    location /api/shorten {
        proxy_pass http://shortener-service:8000/shorten;
    }

    location /api/r/ {
        rewrite ^/api/r/(.*)$ /r/$1 break;
        proxy_pass http://shortener-service:8000;
    }

    location /api/stats/ {
        rewrite ^/api/stats/(.*)$ /stats/$1 break;
        proxy_pass http://analytics-service:8000;
    }

    location / {
        return 404;
    }
}